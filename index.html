<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F0F14">
<title>Fretboard Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F0F14'/%3E%3Cpath d='M6 10h20M6 16h20M6 22h20' stroke='%2389CFF0' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23F4C2C2'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fretboard Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/styles.css">
<script>
  // Just switched instrument (js/switcher.js): start hidden so the new instrument fades in.
  try { if (sessionStorage.getItem('switching-instrument') === '1') document.documentElement.classList.add('fade-in'); } catch (e) {}
  // If the app ever fails to start (a module didn't load), show a way out instead of a blank page.
  // js/app.js sets window.__appStarted when it has drawn the first tab.
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (window.__appStarted) return;
      var box = document.getElementById('load-error');
      if (box) box.hidden = false;
    }, 2500);
  });
  function reloadFresh() {
    // Re-download every file the page used (refreshing the browser's own cache too), then reload.
    var urls = ['js/app.js', 'css/styles.css'].concat((performance.getEntriesByType('resource') || []).map(function (r) { return r.name; }))
      .filter(function (u) { return u.indexOf('http') !== 0 || u.indexOf(location.origin) === 0; });
    var jobs = urls.map(function (u) { return fetch(u, { cache: 'reload' }).catch(function () {}); });
    if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
    Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
  }
</script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<header>
  <div class="title">
    <h1>Fretboard Lab</h1>
    <p>See scales and chords on the neck. Tap any note to hear it.</p>
  </div>
  <div class="head-actions">
    <div id="inst-switch"></div>
    <button id="sound" aria-pressed="true">🔊 Sound on</button>
  </div>
</header>
<div id="install-hint" hidden></div>
<div class="load-error" id="load-error" hidden role="alert">
  <p><b>Fretboard Lab didn't load properly.</b> Your saved progress is safe. Reloading with fresh files usually fixes it.</p>
  <button onclick="reloadFresh()">Reload fresh</button>
</div>
<main>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <div class="timer-bar" id="timer-bar" hidden></div>
  <div id="views"></div>
</main>
<footer>Standard tuning · 15 frets</footer>
<noscript><p style="padding:16px">Fretboard Lab needs JavaScript turned on.</p></noscript>
</body>
</html>
